# Scheduled REPLAY of the sourcing job from committed cassettes and snapshots: it proves the job still runs
# end to end with zero model calls. It is NOT live sourcing (it sees no new data). Live mode is local:
# `make live-run` (fresh pulls -> warehouse -> sourcing with budgeted, cached LLM calls). In production the
# runner would get model credentials through the gateway and run `make live-run` instead.
name: scheduled-replay
on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC = 01:00 / 02:00 Chicago
  workflow_dispatch:
jobs:
  sourcing:
    runs-on: ubuntu-latest
    env:
      VAIOS_STRICT_REPLAY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: make sourcing-run
      - uses: actions/upload-artifact@v4
        with:
          name: memos-and-decision-cards
          path: |
            results/memos/
            results/decision_cards/
            results/sourcing/run_summary.json
