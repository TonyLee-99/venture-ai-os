[project]
name = "venture-ai-os"
version = "0.1.0"
description = "A mini AI operating system for a venture fund: knowledge layer, skills, LLM gateway, and two agent jobs (sourcing-to-memo, monitoring-to-brief) with enforced receipts and point-in-time evals."
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb==2.0.0",
    "httpx==0.28.1",
    "matplotlib==3.11.2",
    "numpy==2.5.4",
    "pandas==3.1.0",
    "pyarrow==26.0.0",
    "pydantic==2.14.2",
    "pyyaml==6.0.3",
    "rapidfuzz==3.14.6",
    "ruptures==1.1.10",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
]
screenshot = [
    "playwright==1.64.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vaios"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
